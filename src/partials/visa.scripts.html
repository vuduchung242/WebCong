<script>
/* Tự động nạp ảnh gallery: quét <prefix>1..MAX (mọi đuôi jpg/png/…), hiện mọi ảnh tồn tại
   theo đúng thứ tự số. Không giới hạn số lượng, không phụ thuộc đánh số liên tục. */
(function () {
  var EXTS = ['jpg', 'jpeg', 'png', 'webp'];
  var MAX = 40; // trần an toàn (số ảnh tối đa mỗi gallery)

  function tryLoad(base, exts, cb) {
    var i = 0;
    (function next() {
      if (i >= exts.length) { cb(null); return; }
      var url = base + '.' + exts[i++];
      var img = new Image();
      img.onload = function () { cb(url); };
      img.onerror = next;
      img.src = url;
    })();
  }

  document.querySelectorAll('[data-gallery]').forEach(function (box) {
    var prefix = box.getAttribute('data-prefix');
    var alt = box.getAttribute('data-alt') || '';
    var found = 0, done = 0;

    for (var n = 1; n <= MAX; n++) {
      (function (idx) {
        tryLoad(prefix + idx, EXTS, function (url) {
          if (url) {
            found++;
            var fig = document.createElement('figure');
            fig.className = 'vs-slide';
            fig.dataset.idx = idx; // giữ thứ tự theo số
            var im = document.createElement('img');
            im.src = url; im.alt = alt; im.loading = 'lazy';
            fig.appendChild(im);
            // chèn đúng vị trí theo idx
            var after = null;
            box.querySelectorAll('.vs-slide').forEach(function (el) {
              if (!after && +el.dataset.idx > idx) after = el;
            });
            box.insertBefore(fig, after);
          }
          if (++done === MAX && found === 0) {
            var f = document.createElement('figure');
            f.className = 'vs-slide is-empty';
            box.appendChild(f);
          }
        });
      })(n);
    }
  });
})();
</script>
<script>
/* Carousel: nút ‹ ›, chấm tiến độ, nhấn ảnh để phóng to */
(function () {
  document.querySelectorAll('.vs-carousel').forEach(function (car) {
    var track = car.querySelector('.vs-carousel__track');
    var dots = car.nextElementSibling;
    var step = function () { var s = track.querySelector('.vs-slide'); return s ? s.offsetWidth + 20 : track.clientWidth; };
    car.querySelector('.vs-carousel__arrow--prev').addEventListener('click', function () { track.scrollBy({ left: -step(), behavior: 'smooth' }); });
    car.querySelector('.vs-carousel__arrow--next').addEventListener('click', function () { track.scrollBy({ left: step(), behavior: 'smooth' }); });
    var render = function () {
      // vòng lặp vô hạn (js/script.js): tính chấm theo bộ thẻ gốc, bỏ qua bản sao 2 bên
      var L = track._loop, W = L ? L.width : track.scrollWidth;
      var pages = Math.max(1, Math.round(W / track.clientWidth));
      var pos = L ? (((track.scrollLeft - L.start) % W) + W) % W : track.scrollLeft;
      var cur = Math.round(pos / track.clientWidth) % pages;
      dots.innerHTML = '';
      for (var i = 0; i < pages; i++) { var d = document.createElement('span'); if (i === cur) d.className = 'is-active'; dots.appendChild(d); }
    };
    track.addEventListener('scroll', render, { passive: true });
    new MutationObserver(render).observe(track, { childList: true });
    window.addEventListener('resize', render);
    track.addEventListener('click', function (e) {
      var img = e.target.closest('.vs-slide img'); if (!img) return;
      var box = document.createElement('div');
      box.className = 'img-lightbox is-open';
      box.innerHTML = '<button class="img-lightbox__close" aria-label="Đóng">✕</button><div class="img-lightbox__inner"><img alt=""></div>';
      box.querySelector('img').src = img.currentSrc || img.src;
      var close = function () { box.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
      var onKey = function (ev) { if (ev.key === 'Escape') close(); };
      box.addEventListener('click', function (ev) { if (ev.target === box || ev.target.closest('.img-lightbox__close')) close(); });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(box); document.body.style.overflow = 'hidden';
    });
  });
})();
</script>
